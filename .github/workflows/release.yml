name: Release Setups

# A LumaLink release is made on a Windows PC with installer/build-setup.ps1: LumaLink-Setup.exe and its signature,
# signed with the release key, which never leaves that PC. Publishing the release runs this workflow, which builds the
# Linux and macOS Setups (installer/build-setup.sh) and adds them to it. installer/sign-release.ps1 then signs them on
# that PC; updates offer the release on Linux and macOS once their signatures are there.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to add the Setups to (v1.2.3)
        required: true

permissions:
  contents: write

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            llvm: Linux-X64
          - os: macos-14
            llvm: macOS-ARM64
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Nebula at the pinned commit
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/keepvaibin/nebula.git nebula
          git -C nebula checkout "$(cat nebula.commit)"
      - uses: dtolnay/rust-toolchain@stable
      - name: The pinned LLVM
        shell: bash
        run: |
          llvm=$(sed -n 's/^pub const LLVM: &str = "\([0-9.]*\)";/\1/p' crates/lumalink-core/src/build.rs)
          curl -fsSL -o "$RUNNER_TEMP/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm/LLVM-$llvm-${{ matrix.llvm }}.tar.xz"
          mkdir "$RUNNER_TEMP/llvm"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components=1
      - name: Build the Setup
        shell: bash
        run: sh installer/build-setup.sh --llvm "$RUNNER_TEMP/llvm" --output "$RUNNER_TEMP/dist"
      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/LumaLink-*Setup-* --clobber --repo "$GITHUB_REPOSITORY"
