name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libarchive-tools libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p lumalink -p lumalink-gui
      - uses: actions/upload-artifact@v4
        with:
          name: lumalink-${{ matrix.os }}
          path: |
            target/release/lumalink
            target/release/lumalink.exe
            target/release/lumalink-gui
            target/release/lumalink-gui.exe
          if-no-files-found: ignore
