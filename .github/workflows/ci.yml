name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Windows: the one platform that blocks a merge.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nebula at the pinned commit
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/NebulaCoop/nebula-coop.git nebula
          git -C nebula checkout "$(cat nebula.commit)"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p lumalink
      - uses: actions/upload-artifact@v4
        with:
          name: lumalink-windows-latest
          path: |
            target/release/lumalink
            target/release/lumalink.exe
          if-no-files-found: ignore

  # The others show their own checks but don't block a merge.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Nebula at the pinned commit
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/NebulaCoop/nebula-coop.git nebula
          git -C nebula checkout "$(cat nebula.commit)"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p lumalink
      - uses: actions/upload-artifact@v4
        with:
          name: lumalink-${{ matrix.os }}
          path: |
            target/release/lumalink
            target/release/lumalink.exe
          if-no-files-found: ignore

  # The one check to require on main.
  result:
    name: CI result
    if: always()
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
